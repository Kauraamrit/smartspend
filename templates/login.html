{% extends "base.html" %}

{% block title %}Login | SmartSpend{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            💰
        </div>

        <h1>
            Manage Your Finances
        </h1>

        <p class="auth-subtitle">
            Login to manage your SmartSpend account
        </p>


        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="primary-button">

                🔐 Login

            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
