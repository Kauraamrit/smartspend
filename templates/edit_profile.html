{% extends "base.html" %}

{% block title %}Edit Profile • SmartSpend{% endblock %}

{% block content %}

<div class="dashboard-page">

    <!-- Page Header -->

    <div class="dashboard-header">

        <div>
            <h1>Edit Profile</h1>

            <p>
                Update your SmartSpend account information.
            </p>
        </div>

        <a
            href="{{ url_for('account') }}"
            class="secondary-button"
        >
            ← Account
        </a>

    </div>


    <!-- Edit Profile Card -->

    <div class="dashboard-card form-card">

        <div class="card-header">

            <div>
                <h2>Personal Information</h2>

                <p>
                    Keep your account information up to date.
                </p>
            </div>

        </div>


        <form method="POST" class="account-form">

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user['name'] }}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user['email'] }}"
                    required
                >

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a
                    href="{{ url_for('account') }}"
                    class="secondary-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


{% endblock %}
