{% extends "base.html" %}

{% block content %}

<div class="transaction-page">

    <div class="transaction-card">

        <div class="transaction-header">

            <div>
                <h1>Add Transaction</h1>

                <p>
                    Record your income or expenses.
                </p>
            </div>

        </div>


        <form
            method="POST"
            action="{{ url_for('add_transaction') }}"
            class="transaction-form"
        >

            <!-- Transaction Type -->

            <div class="form-group">

                <label for="transaction_type">
                    Transaction Type
                </label>

                <select
                    id="transaction_type"
                    name="transaction_type"
                    required
                >

                    <option value="">
                        Select type
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>

            </div>


            <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <div class="amount-input">

                    <span>₹</span>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelance">
                        Freelance
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                    <span>(Optional)</span>
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="What was this transaction for?"
                ></textarea>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="transaction_date">
                    Date
                </label>

                <input
                    type="date"
                    id="transaction_date"
                    name="transaction_date"
                    required
                >

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a
                    href="{{ url_for('dashboard') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    + Add Transaction
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
