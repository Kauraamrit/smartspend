{% extends "base.html" %}

{% block title %}Create Account | SmartSpend{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- LOGO -->
        <div class="auth-logo">
            💰
        </div>


        <!-- HEADING -->
        <h1>Create Your SmartSpend Account</h1>

        <p class="auth-subtitle">
            Start managing your finances today
        </p>


        <!-- REGISTER FORM -->
        <form method="POST"
              action="{{ url_for('register') }}">

            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                >

                <small>
                    Password must contain at least 8 characters.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- CREATE ACCOUNT -->
            <button type="submit"
                    class="primary-button">

                📝 Create Account

            </button>

        </form>


        <!-- LOGIN LINK -->
        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
